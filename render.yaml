# Render Blueprint: one free web service built from the Dockerfile.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
# PUBLIC_BASE_URL is left unset: the app falls back to RENDER_EXTERNAL_URL, which Render provides.
services:
  - type: web
    name: recovery-voice-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: VERIFIED_NUMBERS
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: DEEPGRAM_TTS_VOICE
        value: aura-2-thalia-en
      - key: PLIVO_VERIFY_SIGNATURES
        value: "true"
